<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimulacionEcoWeb · Simulaciones económicas</title>
  <meta name="description" content="SimulacionEcoWeb: simulaciones interactivas y gratuitas de oferta y demanda, interés compuesto, EOQ, punto de reorden, sistemas de revisión, efecto látigo, Beer Game y teoría de colas.">
  <meta name="theme-color" content="#14213D">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex-0.19.1/katex.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="vendor/chartjs-4.5.1/chart.umd.min.js" defer></script>
  <script src="vendor/katex-0.19.1/katex.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body x-data="shell">
  <a class="skip" href="#view" @click.prevent="document.getElementById('view').focus()">Saltar al contenido</a>

  <header class="top">
    <button class="icon-btn menu-btn" type="button" @click="openMenu()" aria-label="Abrir menú de simulaciones" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5 H17 M3 10 H17 M3 15 H17"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="SimulacionEcoWeb, inicio">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#0B6A88"/><path d="M6 19 L11 13 L15 16 L22 8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      SimulacionEcoWeb
    </a>
    <span class="route" x-text="$store.app.route" aria-label="Ruta actual"></span>
    <span class="spacer"></span>
    <div class="tool">
      <label class="seed" for="seed">Semilla
        <input id="seed" type="number" min="0" step="1" inputmode="numeric" x-model.number="$store.app.seed" @change="seedChanged()" aria-describedby="seed-h">
      </label>
      <span id="seed-h" class="sr-only">La misma semilla reproduce exactamente los mismos resultados aleatorios.</span>
      <button class="btn dark sm" type="button" @click="requestSave()">Guardar escenario</button>
      <button class="btn dark sm" type="button" @click="copyLink()">Copiar enlace</button>
      <button class="btn dark sm" type="button" @click="openScenarios()">Escenarios</button>
      <button class="icon-btn" type="button" @click="cycleTheme()" :aria-label="themeLabel" :title="themeLabel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4 A8 8 0 0 1 12 20 Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="side" aria-label="Simulaciones">
      <h2>Simulaciones</h2>
      <ol class="navlist">
        <template x-for="r in routes" :key="r.slug">
          <li><a :href="'#/' + r.slug" :aria-current="isActive(r) ? 'page' : null"><span class="num" x-text="r.num"></span><span x-text="r.title"></span></a></li>
        </template>
      </ol>
    </nav>
    <main id="view" tabindex="-1">
      <p class="loading">Cargando…</p>
    </main>
  </div>

  <dialog class="menu-dlg" x-ref="menu" aria-label="Menú de simulaciones" @click.self="closeMenu()">
    <div class="dlg-head">
      <h2>Simulaciones</h2>
      <button class="icon-btn" type="button" @click="closeMenu()" aria-label="Cerrar menú">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5 L15 15 M15 5 L5 15"/></svg>
      </button>
    </div>
    <nav aria-label="Menú">
      <ol class="navlist">
        <template x-for="r in routes" :key="'m' + r.slug">
          <li><a :href="'#/' + r.slug" @click="closeMenu()" :aria-current="isActive(r) ? 'page' : null"><span class="num" x-text="r.num"></span><span x-text="r.title"></span></a></li>
        </template>
      </ol>
    </nav>
  </dialog>

  <dialog class="dlg" x-ref="scen" aria-labelledby="scen-h">
    <h2 id="scen-h">Escenarios guardados</h2>
    <p class="hint" style="margin-bottom: 12px">Se guardan solo en este navegador. Usa «Copiar enlace» para compartirlos.</p>
    <ul x-show="$store.app.scenarios.length">
      <template x-for="s in $store.app.scenarios" :key="s.id">
        <li>
          <span><a :href="s.hash" @click="$refs.scen.close()" x-text="s.name"></a><small x-text="s.hash"></small></span>
          <button class="btn sm" type="button" @click="removeScenario(s.id)" :aria-label="'Eliminar ' + s.name">Eliminar</button>
        </li>
      </template>
    </ul>
    <p x-show="!$store.app.scenarios.length" style="margin: 0 0 16px">Aún no hay escenarios guardados.</p>
    <form method="dialog"><button class="btn" type="submit">Cerrar</button></form>
  </dialog>

  <div class="toast" role="status" aria-live="polite" x-show="$store.app.toast" x-text="$store.app.toast" x-cloak></div>
  <noscript><p style="padding: 24px">SimulacionEcoWeb necesita JavaScript para ejecutar las simulaciones.</p></noscript>
</body>
</html>
